apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-devsecops
  namespace: solidapps
  labels:
    app: quoterxp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quoterxp
  template:
    metadata:
      labels:
        app: quoterxp
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: quoterxp
        image: hintenhaus04/devops-security-saxion:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
      imagePullSecrets:
        - name: my-registry-secret