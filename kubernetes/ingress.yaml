apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quoter-ingress
  namespace: solidapps
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - quoter.solidapps.local
      secretName: quoter-tls
  rules:
    - host: quoter.solidapps.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ngnix-service
                port:
                  number: 5000